[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-preprocess"
version = "1.1.0"
description = "Automatic 3D facial OBJ preprocessing with optional symmetry and phenotype landmarks"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2,<3",
  "pyyaml>=6,<7",
  "tqdm>=4.66,<5",
  "trimesh>=4.5,<5",
  "rtree>=1.3,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
face-preprocess = "face_preprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model_smoke: requires PyTorch and packaged real checkpoints",
]
